<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="412" viewBox="0 0 1000 412" role="img" aria-labelledby="title desc">
<title id="title">Example, part 2: a machine fails and comes back</title>
<desc id="desc">Two snapshots of the live cell. 3: borglet-4 fails; after three missed polls it is marked DOWN, and its two prod tasks move to borglet-3 and borglet-5, evicting four lower-priority tasks. 4: borglet-4 is back, and waiting batch work refills it.</desc>
