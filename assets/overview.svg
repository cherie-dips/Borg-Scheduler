<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">How Borg Scheduler fits together</title>
<desc id="desc">The live Borg cell: a terminal-style page in a browser talks to the borgmaster over HTTP; the borgmaster checks quota, keeps the pending queue, makes a scheduling pass every second and polls five Borglets, which run each task as a process in its own cgroup. One C++ scheduler library in core/ is linked into the borgmaster, into borgscheduler (the same pass in a process of its own) and into borgsim. The simulator: borgsim takes a workload (a synthetic cell, or Google&#x27;s 2011 cluster trace), places its tasks with the same scheduler, runs cell compaction and six experiments, and writes CSV files that plot.py turns into charts.</desc>
