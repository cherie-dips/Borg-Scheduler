<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">How the project fits together</title>
<desc id="desc">Plan A: the Google cluster trace goes into borgsim, which snapshots the running tasks, runs cell compaction and six experiments, and writes CSV files that plot.py turns into charts. Both borgsim and the borgmaster link the same C++ scheduler library in core/. Plan B: a browser terminal UI talks to the borgmaster over HTTP; the borgmaster schedules every second and polls five Borglet containers, which run each task in its own cgroup. The UI also shows the Plan A results.</desc>
