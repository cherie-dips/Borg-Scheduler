<text x="120" y="62" class="xs" text-anchor="middle" style="font-size:12px" >terminal UI in a browser</text>
<line x1="120" y1="76" x2="120" y2="590" stroke="#c9c7bf" stroke-width="1.4" stroke-dasharray="5 5"/>
<rect x="302.0" y="22" width="176" height="52" rx="10" fill="#ecf8f2" stroke="#1baf7a" stroke-width="1.3" />
<text x="390" y="44" class="h2 mono" text-anchor="middle" style="font-size:14.5px" >borgmaster</text>
<text x="390" y="62" class="xs" text-anchor="middle" style="font-size:12px" >REST API + scheduler</text>
<line x1="390" y1="76" x2="390" y2="590" stroke="#c9c7bf" stroke-width="1.4" stroke-dasharray="5 5"/>
<rect x="572.0" y="22" width="176" height="52" rx="10" fill="#ecf8f2" stroke="#1baf7a" stroke-width="1.3" />
<text x="660" y="44" class="h2" text-anchor="middle" style="font-size:14.5px" >Borglet</text>
<text x="660" y="62" class="xs" text-anchor="middle" style="font-size:12px" >one per machine</text>
<line x1="660" y1="76" x2="660" y2="590" stroke="#c9c7bf" stroke-width="1.4" stroke-dasharray="5 5"/>
<rect x="803.0" y="22" width="150" height="52" rx="10" fill="#fdf1eb" stroke="#eb6834" stroke-width="1.3" />
<text x="878" y="44" class="h2" text-anchor="middle" style="font-size:14.5px" >task</text>
<text x="878" y="62" class="xs" text-anchor="middle" style="font-size:12px" >a process in a cgroup</text>
<line x1="878" y1="76" x2="878" y2="520" stroke="#c9c7bf" stroke-width="1.4" stroke-dasharray="5 5"/>
<rect x="873" y="416" width="10" height="104" rx="3" fill="#eb6834" />
<text x="30" y="116" class="xs" style="font-weight:700;fill:#898781;font-size:12px" >t = 0</text>
<path d="M127,112 L381,112" fill="none" stroke="#6f6e69" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m6f6e69)"/>
<text x="255.0" y="104" class="t mono" text-anchor="middle" style="font-size:12.5px;fill:#0b0b0b" >POST /api/jobs</text>
<text x="255.0" y="131" class="xs" text-anchor="middle" style="font-size:12.5px" >name, priority, tasks, cpu, ram_mb</text>
<rect x="285.0" y="140" width="210" height="31" rx="8" fill="#ffffff" stroke="#1baf7a" stroke-width="1" />
<text x="390" y="160" class="xs" text-anchor="middle" style="font-size:13px;fill:#3b3a37" >tasks join the pending queue</text>
<text x="30" y="206" class="xs" style="font-weight:700;fill:#898781;font-size:12px" >≤ 1 s</text>
<rect x="275.0" y="192" width="230" height="48" rx="8" fill="#f1effc" stroke="#6250d6" stroke-width="1" />
<text x="390" y="212" class="xs" text-anchor="middle" style="font-size:13px;fill:#3b3a37" >scheduler pass: order,</text>
<text x="390" y="229" class="xs" text-anchor="middle" style="font-size:13px;fill:#3b3a37" >filter, score, preempt</text>
<path d="M397,266 L651,266" fill="none" stroke="#6f6e69" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m6f6e69)"/>
<text x="525.0" y="258" class="t mono" text-anchor="middle" style="font-size:12.5px;fill:#0b0b0b" >DELETE /tasks/&lt;victim&gt;</text>
<text x="525.0" y="285" class="xs" text-anchor="middle" style="font-size:12.5px" >if preempting: SIGTERM, then SIGKILL</text>
<path d="M397,316 L651,316" fill="none" stroke="#6f6e69" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m6f6e69)"/>
<text x="525.0" y="308" class="t mono" text-anchor="middle" style="font-size:12.5px;fill:#0b0b0b" >POST /tasks</text>
<text x="525.0" y="335" class="xs" text-anchor="middle" style="font-size:12.5px" >id, attempt, cpu, ram_mb, workload</text>
<text x="30" y="360" class="xs" style="font-weight:700;fill:#898781;font-size:12px" >+2 s</text>
<rect x="547.0" y="342" width="226" height="48" rx="8" fill="#ffffff" stroke="#1baf7a" stroke-width="1" />
<text x="660" y="362" class="xs" text-anchor="middle" style="font-size:13px;fill:#3b3a37" >first use of this package:</text>
<text x="660" y="379" class="xs" text-anchor="middle" style="font-size:13px;fill:#3b3a37" >“installing” for 2 s</text>
<path d="M667,416 L869,416" fill="none" stroke="#6f6e69" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m6f6e69)"/>
<text x="769.0" y="408" class="t mono" text-anchor="middle" style="font-size:12.5px;fill:#0b0b0b" >start</text>
<text x="769.0" y="435" class="xs" text-anchor="middle" style="font-size:12.5px" >new cgroup v2:</text>
<text x="769.0" y="452" class="xs mono" text-anchor="middle" style="font-size:12px" >cpu.max, memory.max</text>
<text x="30" y="474" class="xs" style="font-weight:700;fill:#898781;font-size:12px" >every 1 s</text>
<path d="M397,470 L651,470" fill="none" stroke="#6f6e69" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m6f6e69)"/>
<text x="525.0" y="462" class="t mono" text-anchor="middle" style="font-size:12.5px;fill:#0b0b0b" >GET /status</text>
<path d="M653,498 L399,498" fill="none" stroke="#6f6e69" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#m6f6e69)"/>
<text x="525.0" y="490" class="t" text-anchor="middle" style="font-size:13px" >state + CPU/RAM use of each task</text>
<path d="M127,470 L381,470" fill="none" stroke="#6f6e69" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m6f6e69)"/>
<text x="255.0" y="462" class="t mono" text-anchor="middle" style="font-size:12.5px;fill:#0b0b0b" >GET /api/state</text>
<path d="M383,498 L129,498" fill="none" stroke="#6f6e69" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#m6f6e69)"/>
<text x="255.0" y="490" class="t" text-anchor="middle" style="font-size:13px" >jobs, tasks, machines, events</text>
<text x="120" y="530" class="xs" text-anchor="middle" style="font-size:12.5px" >the UI redraws:</text>
<text x="120" y="547" class="xs" text-anchor="middle" style="font-size:12.5px" >progress, usage, log</text>
<rect x="250" y="600" width="690" height="56" rx="10" fill="#fdf1eb" stroke="#eb6834" stroke-width="1" />
<text x="270" y="624" class="t" style="font-size:13px" ><tspan style="font-weight:700">If a Borglet misses 3 polls</tspan> it is marked DOWN and its tasks go back to pending,</text>
<text x="270" y="643" class="t" style="font-size:13px" >so the next pass places them elsewhere. When it returns, stray tasks on it are killed.</text>
</svg>
