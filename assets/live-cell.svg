<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="676" viewBox="0 0 1000 676" role="img" aria-labelledby="title desc">
<title id="title">What happens when you submit a job</title>
<desc id="desc">The browser posts the job to the borgmaster, which adds its tasks to the pending queue. Within a second the scheduler loop places them, evicting lower-priority tasks first if needed. The master asks the chosen Borglet to start each task; the Borglet installs the package on first use, creates a cgroup with the task&#x27;s CPU and memory limits, and starts the process. Every second the master polls each Borglet for task state and usage, and the browser polls the master for the cell&#x27;s state. A Borglet that misses three polls is marked down and its tasks are rescheduled.</desc>
