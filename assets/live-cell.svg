.t { font-size: 13.5px; fill: #3b3a37; }
.s { font-size: 12.5px; fill: #52514e; }
.xs { font-size: 11.5px; fill: #52514e; }
.k { font-size: 11.5px; font-weight: 700; letter-spacing: .07em; }
.lab { font-size: 12px; fill: #52514e; }
</style>
<defs><marker id="m6f6e69" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0.5,0.8 L9,5 L0.5,9.2 L2.6,5 z" fill="#6f6e69"/></marker></defs>
<rect x="0.5" y="0.5" width="999.0" height="675.0" rx="16" fill="#fcfcfb" stroke="#e4e3dd" stroke-width="1" />
<rect x="32.0" y="22" width="176" height="52" rx="10" fill="#eef5fd" stroke="#2a78d6" stroke-width="1.3" />
