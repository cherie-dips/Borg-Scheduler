<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="412" viewBox="0 0 1000 412" role="img" aria-labelledby="title desc">
<title id="title">Example, part 1: the cell fills up, then a priority-250 job arrives</title>
<desc id="desc">Two snapshots of the live cell. 1: web-frontend, crawler and analytics fill the cell; all 24 tasks are placed. 2: at 26 s the priority-250 payments job arrives and evicts ten batch and free-tier tasks, never a prod task.</desc>
