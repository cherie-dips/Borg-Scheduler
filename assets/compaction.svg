<circle cx="538" cy="49" r="11" fill="#2a78d6"/>
<text x="538" y="53.3" class="k" text-anchor="middle" style="fill:#ffffff;letter-spacing:0" >3</text>
<text x="557" y="54" class="h2" style="font-size:15px" >Shrink the cell</text>
<text x="528" y="260" class="t" style="font-size:13px" >binary search on n: pack all</text>
<text x="528" y="279" class="t" style="font-size:13px" >tasks onto the first n; it fits</text>
<text x="528" y="298" class="t" style="font-size:13px" >if ≤ 0.2% stay pending</text>
