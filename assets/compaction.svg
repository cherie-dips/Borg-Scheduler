<text x="73" y="54" class="h2" style="font-size:15px" >Take a snapshot</text>
<text x="44" y="260" class="t" style="font-size:13px" >every task running at one</text>
<text x="44" y="279" class="t" style="font-size:13px" >moment: 144,266 tasks on</text>
<text x="44" y="298" class="t" style="font-size:13px" >12,480 machines</text>
