<circle cx="296" cy="49" r="11" fill="#2a78d6"/>
<text x="296" y="53.3" class="k" text-anchor="middle" style="fill:#ffffff;letter-spacing:0" >2</text>
<text x="315" y="54" class="h2" style="font-size:15px" >Shuffle machines</text>
<text x="286" y="260" class="t" style="font-size:13px" >a new random order per</text>
<text x="286" y="279" class="t" style="font-size:13px" >seed, so a smaller cell</text>
<text x="286" y="298" class="t" style="font-size:13px" >keeps the same mix</text>
