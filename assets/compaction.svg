<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc">
<title id="title">Cell compaction</title>
<desc id="desc">Step 1 takes a snapshot of every task running at one moment in the trace. Step 2 shuffles the machines with a seed. Step 3 binary-searches the smallest number of machines n such that the scheduler packs all tasks onto the first n machines with at most 0.2% left pending. Step 4 repeats this for 11 seeds and reports the 90th percentile.</desc>
