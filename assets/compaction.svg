text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #0b0b0b; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
.h { font-size: 16px; font-weight: 700; }
.h2 { font-size: 14.5px; font-weight: 700; }
.t { font-size: 13.5px; fill: #3b3a37; }
.s { font-size: 12.5px; fill: #52514e; }
.xs { font-size: 11.5px; fill: #52514e; }
.k { font-size: 11.5px; font-weight: 700; letter-spacing: .07em; }
.lab { font-size: 12px; fill: #52514e; }
</style>
