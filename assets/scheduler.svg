<text x="73" y="54" class="h2" style="font-size:15px" >Order the queue</text>
<text x="44" y="208" class="t" style="font-size:13px" >highest priority first</text>
<text x="44" y="227" class="t" style="font-size:13px" >round-robin across users</text>
<text x="44" y="246" class="t" style="font-size:13px" >within one priority</text>
