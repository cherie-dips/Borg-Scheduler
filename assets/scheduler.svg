<text x="528" y="311" class="k" style="fill:#4a3aa7;font-size:10.5px" >§3.4 SPEED-UP</text>
<text x="528" y="331" class="h2" style="font-size:13.5px" >Score cache</text>
<text x="528" y="350" class="s" >reuse a score until that</text>
<text x="528" y="367" class="s" >machine changes</text>
<circle cx="538" cy="49" r="11" fill="#2a78d6"/>
<text x="538" y="53.3" class="k" text-anchor="middle" style="fill:#ffffff;letter-spacing:0" >3</text>
<text x="557" y="54" class="h2" style="font-size:15px" >Score each one</text>
<text x="528" y="208" class="t" style="font-size:13px" >policy term (hybrid)</text>
<text x="528" y="227" class="t" style="font-size:13px" >− cost of evictions</text>
<text x="528" y="246" class="t" style="font-size:13px" >+ spread a job out</text>
<text x="528" y="265" class="t" style="font-size:13px" >+ package already there</text>
<path d="M734,127 L750,127" fill="none" stroke="#6f6e69" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m6f6e69)"/>
