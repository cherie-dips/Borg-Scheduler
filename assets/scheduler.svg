<text x="286" y="331" class="h2" style="font-size:13.5px" >Relaxed randomization</text>
<text x="286" y="350" class="s" >random order; stop after</text>
<text x="286" y="367" class="s" >64 feasible machines</text>
<circle cx="296" cy="49" r="11" fill="#2a78d6"/>
<text x="296" y="53.3" class="k" text-anchor="middle" style="fill:#ffffff;letter-spacing:0" >2</text>
<text x="315" y="54" class="h2" style="font-size:15px" >Filter machines</text>
<text x="286" y="208" class="t" style="font-size:13px" >hard constraints match</text>
<text x="286" y="227" class="t" style="font-size:13px" >distinct machines, if asked</text>
<text x="286" y="246" class="t" style="font-size:13px" >room left, counting lower</text>
<text x="286" y="265" class="t" style="font-size:13px" >priorities as free</text>
