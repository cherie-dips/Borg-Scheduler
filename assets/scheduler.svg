<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="448" viewBox="0 0 1000 448" role="img" aria-labelledby="title desc">
<title id="title">One scheduling pass</title>
<desc id="desc">Step 1 orders the pending tasks by priority, round-robin across users; identical tasks are grouped into equivalence classes. Step 2 keeps the machines that satisfy the hard constraints and have room, counting lower-priority tasks as free; it samples machines in random order and stops after 64 feasible ones. Step 3 scores each feasible machine with the policy plus a preemption cost and small bonuses; scores are cached until a machine changes. Step 4 places the task on the best machine, evicting lower-priority tasks if needed; evicted tasks go back to the queue for the next pass. In the live cell a Borglet then starts the task; in the simulator it simply counts as placed.</desc>
