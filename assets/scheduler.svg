<text x="770" y="311" class="k" style="fill:#0f7a55;font-size:10.5px" >THEN</text>
<text x="770" y="331" class="h2" style="font-size:13.5px" >Run the task</text>
<text x="770" y="350" class="s" >a Borglet starts it, or</text>
<text x="770" y="367" class="s" >the simulator counts it</text>
<circle cx="780" cy="49" r="11" fill="#2a78d6"/>
<text x="780" y="53.3" class="k" text-anchor="middle" style="fill:#ffffff;letter-spacing:0" >4</text>
<text x="799" y="54" class="h2" style="font-size:15px" >Place or preempt</text>
<text x="770" y="208" class="t" style="font-size:13px" >best score wins</text>
<text x="770" y="227" class="t" style="font-size:13px" >short on room? evict the</text>
<text x="770" y="246" class="t" style="font-size:13px" >lowest priority first</text>
<text x="770" y="265" class="t" style="font-size:13px" >prod never preempts prod</text>
